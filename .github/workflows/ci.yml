name: CI

on:
  push:
    branches: [ master ]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint/test/build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx nx lint frontend

      - name: Test
        run: npx nx test frontend

      - name: Build
        run: npx nx build frontend

  backend:
    name: Backend (test/build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run tests
        working-directory: apps/backend
        env:
          SPRING_PROFILES_ACTIVE: test
        run: |
          chmod +x mvnw
          ./mvnw -q test

      - name: Build jar
        working-directory: apps/backend
        run: |
          ./mvnw -q clean package -DskipTests
          test -f target/backend-0.0.1-SNAPSHOT.jar
          ls -lh target/backend-0.0.1-SNAPSHOT.jar

      - name: Upload backend jar for E2E
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: apps/backend/target/backend-0.0.1-SNAPSHOT.jar
          if-no-files-found: error
          retention-days: 1

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: juggleflow_db
          POSTGRES_USER: juggleflow_user
          POSTGRES_PASSWORD: juggleflow_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U juggleflow_user -d juggleflow_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_DB: juggleflow_db
      POSTGRES_USER: juggleflow_user
      POSTGRES_PASSWORD: juggleflow_dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/juggleflow_db
      JWT_SECRET: e2e-ci-jwt-secret-must-be-at-least-32-chars-long
      CORS_ALLOWED_ORIGINS: http://localhost:4200
      COOKIE_SECURE: "false"
      DEMO_BOOTSTRAP_ENABLED: "true"
      DEMO_BOOTSTRAP_PASSWORD: Demo2026!
      ADMIN_BOOTSTRAP_EMAIL: admin@juggleflow.local
      ADMIN_BOOTSTRAP_PASSWORD: Admin2026!
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      APP_JWT_REVOCATION_STORE: redis
      APP_RATE_LIMIT_STORE: redis
      APP_TRUSTED_PROXY: "true"
      # Chaque visite de /login appelle aussi /auth/refresh (compté dans le quota).
      APP_RATE_LIMIT_MAX_REQUESTS: "80"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Wait for Postgres and Redis
        run: |
          wait_for_port() {
            local port="$1" name="$2"
            for _ in $(seq 1 30); do
              if bash -c "echo > /dev/tcp/127.0.0.1/${port}" 2>/dev/null; then
                echo "${name} reachable on port ${port}"
                return 0
              fi
              sleep 2
            done
            echo "${name} not reachable on port ${port}"
            return 1
          }
          wait_for_port 5432 Postgres
          wait_for_port 6379 Redis

      - name: Download backend jar
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: e2e-artifacts

      - name: Resolve backend jar path
        id: jar
        run: |
          set -euo pipefail
          echo "Artifact tree:"
          find e2e-artifacts -type f -print || true
          JAR="$(find e2e-artifacts -type f -name 'backend-0.0.1-SNAPSHOT.jar' ! -name '*.original' | head -n 1 || true)"
          if [ -z "${JAR}" ]; then
            JAR="$(find e2e-artifacts -type f -name '*.jar' ! -name '*.original' | head -n 1 || true)"
          fi
          if [ -z "${JAR}" ] || [ ! -f "${JAR}" ]; then
            echo "Artifact jar missing — rebuilding locally as fallback"
            chmod +x apps/backend/mvnw
            (cd apps/backend && ./mvnw -q package -DskipTests)
            JAR="apps/backend/target/backend-0.0.1-SNAPSHOT.jar"
          fi
          if [ ! -f "${JAR}" ]; then
            echo "FATAL: no backend jar available"
            exit 1
          fi
          cp "${JAR}" "${RUNNER_TEMP}/juggleflow-backend.jar"
          ls -lh "${RUNNER_TEMP}/juggleflow-backend.jar"
          echo "path=${RUNNER_TEMP}/juggleflow-backend.jar" >> "$GITHUB_OUTPUT"

      - name: Start API with demo data
        run: |
          set -euo pipefail
          JAR="${{ steps.jar.outputs.path }}"
          echo "Starting backend from ${JAR}"
          # setsid: détache le process du step shell (sinon risque de SIGHUP en fin de step)
          setsid java -jar "${JAR}" > backend-e2e.log 2>&1 < /dev/null &
          echo $! > backend.pid
          echo "Backend PID=$(cat backend.pid)"

          for i in $(seq 1 90); do
            if ! kill -0 "$(cat backend.pid)" 2>/dev/null; then
              echo "Backend process exited early (attempt ${i})"
              tail -n 200 backend-e2e.log || true
              exit 1
            fi

            if curl -sf http://127.0.0.1:8080/actuator/health 2>/dev/null | grep -q '"status":"UP"'; then
              LOGIN_BODY='{"email":"marie.dupont@ecole.fr","password":"Demo2026!"}'
              if curl -sf -X POST http://127.0.0.1:8080/api/auth/login \
                -H 'Content-Type: application/json' \
                -d "${LOGIN_BODY}" \
                | grep -q 'accessToken'; then
                echo "Backend ready (health + demo login OK) after ${i} attempt(s)"
                exit 0
              fi
              echo "Health UP but demo login not ready yet (attempt ${i})"
            else
              echo "Waiting for health… (attempt ${i}/90)"
            fi
            sleep 5
          done

          echo "Backend failed to become ready in time"
          tail -n 200 backend-e2e.log || true
          exit 1

      - name: Run E2E tests
        env:
          CI: true
          PLAYWRIGHT_BACKEND_URL: http://127.0.0.1:8080
          E2E_RATE_LIMIT_PROBE_ATTEMPTS: "85"
          E2E_PASSWORD: Demo2026!
          E2E_TEACHER_EMAIL: marie.dupont@ecole.fr
          E2E_STUDENT_EMAIL: lucas.martin@ecole.fr
          E2E_ADMIN_EMAIL: admin@juggleflow.local
          E2E_ADMIN_PASSWORD: Admin2026!
        run: npm run e2e

      - name: Stop API
        if: always()
        run: |
          if [ -f backend.pid ]; then
            kill "$(cat backend.pid)" 2>/dev/null || true
            sleep 1
            kill -9 "$(cat backend.pid)" 2>/dev/null || true
          fi

      - name: Upload backend log on E2E failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-e2e-log
          path: backend-e2e.log
          if-no-files-found: warn
          retention-days: 3

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/frontend/playwright-report
          if-no-files-found: warn
          retention-days: 7
