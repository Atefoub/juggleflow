<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="JuggleFlow">
  <defs>
    <linearGradient id="blob" x1="32" y1="12" x2="32" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF3D9A"/>
      <stop offset="42%" stop-color="#C43BFF"/>
      <stop offset="72%" stop-color="#5B6CFF"/>
      <stop offset="100%" stop-color="#2EB6FF"/>
    </linearGradient>
    <linearGradient id="ringA" x1="12" y1="18" x2="50" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF4DA6"/>
      <stop offset="55%" stop-color="#FF7A3A"/>
      <stop offset="100%" stop-color="#FFB020"/>
    </linearGradient>
    <linearGradient id="ringB" x1="50" y1="16" x2="16" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF5AB0"/>
      <stop offset="100%" stop-color="#4DA6FF"/>
    </linearGradient>
    <radialGradient id="glow" cx="32" cy="32" r="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7A3DFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0A0E2A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planet" cx="38%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#FFE08A"/>
      <stop offset="55%" stop-color="#FFB020"/>
      <stop offset="100%" stop-color="#FF8A1A"/>
    </radialGradient>
  </defs>

  <rect width="64" height="64" fill="#0A0E2A"/>
  <rect width="64" height="64" fill="url(#glow)"/>

  <!-- Orbital rings sit behind the core so the mark stays readable at 16px -->
  <g fill="none" stroke-linecap="round">
    <ellipse cx="32" cy="32" rx="23.5" ry="9.2" transform="rotate(48 32 32)" stroke="url(#ringB)" stroke-width="2.5"/>
    <ellipse cx="32" cy="32" rx="24.5" ry="10" transform="rotate(-30 32 32)" stroke="url(#ringA)" stroke-width="2.8"/>
  </g>

  <ellipse cx="32" cy="32.2" rx="12.6" ry="19" fill="url(#blob)"/>
  <ellipse cx="32" cy="24.5" rx="7.2" ry="8.5" fill="#fff" opacity="0.16"/>

  <circle cx="15.2" cy="42.2" r="4.1" fill="url(#planet)"/>
  <circle cx="14.2" cy="41" r="1.35" fill="#fff" opacity="0.45"/>
</svg>
